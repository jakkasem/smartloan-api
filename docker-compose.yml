version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartloan-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - smartloan_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: smartloan-app
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: "postgresql://myuser:mysecretpassword@postgres:5432/mydb"
      API_KEY: "your-secret-api-key"
      NODE_ENV: "production"
      WEBHOOK_URL: "http://n8n:5678/webhook/smart-loan"
    depends_on:
      - postgres
      - n8n
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: smartloan-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      WEBHOOK_URL: "http://n8n:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  smartloan_pgdata:
  n8n_data:
